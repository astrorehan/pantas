name: Production health monitor

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: production-health
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  health:
    name: web, grading engine, and database
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check production health
        run: >-
          node scripts/check-health.mjs
          --url https://pantas-ai.vercel.app
          --attempts 3
          --interval-ms 5000
