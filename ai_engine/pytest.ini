[pytest]
# `python_files` disempitkan dengan sengaja. `test_integration.py` dan
# `test_model_2.py` adalah skrip jalan-tangan warisan — keduanya memakai jalur
# absolut milik satu mesin dan memanggil sys.exit(), jadi pytest tidak boleh
# mengumpulkannya sebagai tes. Set regresi F-100 memakai awalan test_regresi_.
#
# `test_unit_*.py` adalah tes murni-Python: tidak memuat bobot YOLO, tidak
# menyentuh disk, jalannya milidetik. Dipisah dari set regresi supaya bisa
# dijalankan di mesin yang tidak punya `export_models/`.
python_files = test_regresi_*.py test_unit_*.py

# Bobot YOLO dimuat sekali per sesi; jalannya beberapa detik per foto, jadi
# ringkasan yang menyebut alasan skip/xfail lebih berguna daripada titik-titik.
addopts = -ra
